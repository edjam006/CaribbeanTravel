<!doctype html>

<head>
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-MGN95BTV"></script>
<script>
  
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<script>
  (function () {
    function avisar() {
      (window.dataLayer = window.dataLayer || []).push({
        event: 'whatsapp_click',
        wa_pagina: location.pathname + location.search
      });
    }
    // Botones que abren WhatsApp con JavaScript
    var abrir = window.open;
    window.open = function (url) {
      try { if (url && /wa\.me|whatsapp\.com/i.test(url)) avisar(); } catch (e) {}
      return abrir.apply(window, arguments);
    };
    // Enlaces normales a WhatsApp
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href*="wa.me"], a[href*="whatsapp.com"]');
      if (a) avisar();
    }, true);
  })();
  </script>
  <meta charset="utf-8">
  <title>Paquete Panamá · Caribbean Travel</title>

  <script>location.replace("/destino?d=panama");</script>
</head>
